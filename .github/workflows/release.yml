name: Release

on:
  release:
    types: [published]

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate release version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          case "$RELEASE_TAG" in v*) ;; *) exit 1 ;; esac
          version="${RELEASE_TAG#v}"
          node -e "if (!/^\\d+\\.\\d+\\.\\d+(?:-[0-9A-Za-z.-]+)?(?:\\+[0-9A-Za-z.-]+)?$/.test(process.argv[1])) process.exit(1)" "$version"
          echo "release_version=$version" >> "$GITHUB_OUTPUT"

  verify_ci:
    needs: validate
    runs-on: ubuntu-24.04
    outputs:
      ci_run_id: ${{ steps.attestation.outputs.ci_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify release commit and CI attestation
        id: attestation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          node scripts/ci/verify-release-attestation.mjs

  publish:
    needs: [validate, verify_ci]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Stamp release version
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
        run: node scripts/ci/stamp-release-version.mjs --release-version "$RELEASE_VERSION"
      - name: Authenticate cargo-fui crate
        id: crates_io_cli
        uses: rust-lang/crates-io-auth-action@v1
      - name: Verify publishable cargo-fui crate
        run: cargo package --manifest-path v2/cargo-fui/Cargo.toml --allow-dirty
      - name: Publish cargo-fui idempotently
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_cli.outputs.token }}
          RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
        run: node scripts/ci/publish-crate-idempotently.mjs --manifest-path v2/cargo-fui/Cargo.toml --crate cargo-fui --version "$RELEASE_VERSION"
      - name: Report release
        run: |
          {
            echo '## cargo-fui released'
            echo
            echo "Crate: cargo-fui@${{ needs.validate.outputs.release_version }}"
            echo "Verified CI run: ${{ needs.verify_ci.outputs.ci_run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
