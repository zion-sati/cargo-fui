name: CI

on:
  push:
    branches: [main]
    paths: &cargo_fui_ci_inputs
      - '.github/workflows/ci.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/ci/**'
      - 'v2/cargo-fui/**'
      - 'v2/native/packaging/**'
  pull_request:
    paths: *cargo_fui_ci_inputs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inputs:
    runs-on: ubuntu-24.04
    outputs:
      fui_rs_version: ${{ steps.resolve.outputs.fui_rs_version }}
      runtime_version: ${{ steps.resolve.outputs.runtime_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve the current FUI-RS and runtime releases
        id: resolve
        run: node scripts/ci/resolve-scaffold-inputs.mjs

  rust:
    needs: inputs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Pin the resolved scaffold inputs
        env:
          FUI_RS_VERSION: ${{ needs.inputs.outputs.fui_rs_version }}
          RUNTIME_VERSION: ${{ needs.inputs.outputs.runtime_version }}
        run: node scripts/ci/stamp-release-inputs.mjs
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: node --test scripts/ci/publish-crate-idempotently.test.mjs
      - run: cargo package --manifest-path v2/native/packaging/Cargo.toml --allow-dirty
      - name: Verify cargo-fui package contents
        run: cargo package --manifest-path v2/cargo-fui/Cargo.toml --allow-dirty --list >/dev/null

  native-acceptance:
    needs: inputs
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: native
          - os: windows-2025
            target: native
          - os: ubuntu-24.04
            target: native
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Pin the resolved scaffold inputs
        env:
          FUI_RS_VERSION: ${{ needs.inputs.outputs.fui_rs_version }}
          RUNTIME_VERSION: ${{ needs.inputs.outputs.runtime_version }}
        run: node scripts/ci/stamp-release-inputs.mjs
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev \
            libfontconfig1-dev \
            libfuse2 \
            libvulkan-dev \
            libx11-dev \
            libxext-dev \
            squashfs-tools \
            xvfb
      - name: Install AppImageTool
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -o /tmp/appimagetool
          chmod +x /tmp/appimagetool
          echo /tmp >> "$GITHUB_PATH"
      - name: Add Windows SDK tools to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $makeAppx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter makeappx.exe |
            Where-Object FullName -Match '\\x64\\' | Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $makeAppx) { throw 'makeappx.exe was not found' }
          $makeAppx.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Scaffold native smoke app
        run: cargo run --manifest-path v2/cargo-fui/Cargo.toml -- fui new native-smoke --target native
      - name: Build, launch, and package native smoke app
        working-directory: native-smoke
        run: |
          cargo run --manifest-path ../v2/cargo-fui/Cargo.toml -- fui build --release
          node ../scripts/ci/smoke-generated-native.mjs .
          cargo run --manifest-path ../v2/cargo-fui/Cargo.toml -- fui package
          node ../scripts/ci/smoke-generated-package.mjs .

  web-acceptance:
    needs: inputs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Pin the resolved scaffold inputs
        env:
          FUI_RS_VERSION: ${{ needs.inputs.outputs.fui_rs_version }}
          RUNTIME_VERSION: ${{ needs.inputs.outputs.runtime_version }}
        run: node scripts/ci/stamp-release-inputs.mjs
      - name: Scaffold and build browser smoke app
        run: |
          cargo run --manifest-path v2/cargo-fui/Cargo.toml -- fui new web-smoke --target web
          cd web-smoke
          cargo run --manifest-path ../v2/cargo-fui/Cargo.toml -- fui build --release
      - name: Install browser smoke dependency
        working-directory: web-smoke
        run: |
          npm install --no-save @playwright/test@1.59.1
          npx playwright install --with-deps chromium
      - name: Launch generated browser app
        run: node scripts/ci/smoke-generated-web.mjs web-smoke/public web-smoke/node_modules

  attest:
    needs: [inputs, rust, native-acceptance, web-acceptance]
    runs-on: ubuntu-24.04
    steps:
      - name: Record the tested dependency pins
        env:
          FUI_RS_VERSION: ${{ needs.inputs.outputs.fui_rs_version }}
          RUNTIME_VERSION: ${{ needs.inputs.outputs.runtime_version }}
        run: |
          mkdir -p release-inputs
          node - <<'NODE'
          const fs = require('node:fs');
          fs.writeFileSync('release-inputs/attestation.json', `${JSON.stringify({
            sha: process.env.GITHUB_SHA,
            fuiRsVersion: process.env.FUI_RS_VERSION,
            runtimeVersion: process.env.RUNTIME_VERSION,
          }, null, 2)}\n`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: cargo-fui-release-inputs
          path: release-inputs/attestation.json
          retention-days: 90
