name: CI

on:
  push:
    branches: [main]
    paths: &cargo_fui_ci_inputs
      - '.github/workflows/ci.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'update-deps.sh'
      - 'scripts/ci/**'
      - 'v2/cargo-fui/**'
      - 'v2/native/packaging/**'
  pull_request:
    paths: *cargo_fui_ci_inputs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: node --test scripts/ci/publish-crate-idempotently.test.mjs
      - run: cargo package --manifest-path v2/native/packaging/Cargo.toml --allow-dirty
      - name: Verify cargo-fui package contents
        run: cargo package --manifest-path v2/cargo-fui/Cargo.toml --allow-dirty --list >/dev/null

  native-acceptance:
    name: native-acceptance / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-14
            architecture: arm64
          - name: macos-x64
            os: macos-15-intel
            architecture: x64
          - name: windows-arm64
            os: windows-11-arm
            architecture: arm64
          - name: windows-x64
            os: windows-2022
            architecture: x64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            architecture: arm64
            appimage_architecture: aarch64
          - name: linux-x64
            os: ubuntu-24.04
            architecture: x64
            appimage_architecture: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.architecture }}
      - name: Remove undeclared Windows Clang toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cleanPath = (($env:PATH -split ';') | Where-Object {
            $_ -and $_ -notmatch '(?i)(\\|/)(LLVM|Clang)(\\|/|$)'
          }) -join ';'
          $env:PATH = $cleanPath
          "PATH=$cleanPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if (Get-Command clang -ErrorAction SilentlyContinue) {
            throw 'clang remains available in the clean Windows acceptance environment'
          }
          if (-not (Get-Command cl -ErrorAction SilentlyContinue)) {
            throw 'MSVC cl.exe is unavailable after removing Clang'
          }
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev \
            libfontconfig1-dev \
            libfuse2 \
            libvulkan-dev \
            libx11-dev \
            libxext-dev \
            mesa-vulkan-drivers \
            squashfs-tools \
            xvfb
      - name: Install AppImageTool
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.appimage_architecture }}.AppImage -o /tmp/appimagetool
          chmod +x /tmp/appimagetool
          echo /tmp >> "$GITHUB_PATH"
      - name: Select Linux software Vulkan driver
        if: runner.os == 'Linux'
        run: |
          vulkan_icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' -print -quit)"
          test -n "$vulkan_icd"
          echo "VK_DRIVER_FILES=$vulkan_icd" >> "$GITHUB_ENV"
      - name: Add Windows SDK tools to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $makeAppx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter makeappx.exe |
            Where-Object { $_.Directory.Name -eq '${{ matrix.architecture }}' } | Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $makeAppx) { throw 'makeappx.exe was not found' }
          $makeAppx.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Prepare clean Cargo installation environment
        shell: bash
        run: |
          echo "CARGO_HOME=$RUNNER_TEMP/cargo-home" >> "$GITHUB_ENV"
          echo "CARGO_INSTALL_ROOT=$RUNNER_TEMP/cargo-fui-install" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/cargo-fui-install/bin" >> "$GITHUB_PATH"
      - name: Install cargo-fui from source package
        run: cargo install --locked --path v2/cargo-fui
      - name: Scaffold native smoke app
        run: cargo fui new native-smoke --target native
      - name: Build, launch, and package native smoke app
        working-directory: native-smoke
        run: |
          cargo fui build --release
          node ../scripts/ci/smoke-generated-native.mjs .
          cargo fui package
          node ../scripts/ci/smoke-generated-package.mjs .

  web-acceptance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Scaffold and build browser smoke app
        run: |
          cargo run --manifest-path v2/cargo-fui/Cargo.toml -- fui new web-smoke --target web
          cd web-smoke
          cargo run --manifest-path ../v2/cargo-fui/Cargo.toml -- fui build --release
      - name: Install browser smoke dependency
        working-directory: web-smoke
        run: |
          npm install --no-save @playwright/test@1.59.1
          npx playwright install --with-deps chromium
      - name: Launch generated browser app
        run: node scripts/ci/smoke-generated-web.mjs web-smoke/public web-smoke/node_modules
