[package]
name = "cargo-fui"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Build and package FUI-RS applications for native desktop and WebAssembly"
repository = "https://github.com/zion-sati/cargo-fui"
homepage = "https://effindom.dev"
readme = "README.md"
keywords = ["effindom", "fui-rs", "gui", "scaffolding", "packaging"]
categories = ["command-line-utilities", "development-tools", "gui"]
publish = ["crates-io"]
include = [
  "/src/**/*.rs",
  "/templates/**",
  "/tests/**/*.rs",
  "/Cargo.toml",
  "/Cargo.lock",
  "/README.md",
  "/LICENSE.md",
]

[dependencies]
effindom-native-packaging = { path = "../native/packaging", version = "0.1.0" }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
ureq = { version = "2.12", default-features = false, features = ["native-tls"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[lib]
name = "cargo_fui"
path = "src/lib.rs"

[[bin]]
name = "cargo-fui"
path = "src/main.rs"
